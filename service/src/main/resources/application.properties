spring.application.name=service



# Configuración de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/backlog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081
# Configuración de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuración de seguridad JWT
# El secreto debe tener al menos 32 caracteres y en producción debe venir por variable de entorno.
security.jwt.secret=${JWT_SECRET:cambiar-esta-clave-en-produccion-minimo-32-caracteres}
# Tiempo de expiración del token en milisegundos (por defecto 24 horas).
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Configuración del inicio de sesión con Google.
# Debe coincidir con el Client ID (tipo Web) configurado en Google Cloud Console
# y con el valor googleClientId de frontend/src/environments/environment.ts.
security.google.client-id=${GOOGLE_CLIENT_ID:641279425498-ji3o0oe4qu3fhadgbm5pk9rim73d8k0i.apps.googleusercontent.com}
