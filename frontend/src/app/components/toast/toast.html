@if (message()) {
  <div
    class="fixed bottom-6 right-6 z-50 flex items-center gap-3 rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-3 text-xs text-white shadow-2xl transition-all"
  >
    <span
      class="material-symbols-outlined text-lg"
      [class.text-emerald-400]="type() === 'success'"
      [class.text-red-500]="type() === 'error'"
    >
      {{ type() === 'success' ? 'check_circle' : 'error' }}
    </span>
    <span>{{ message() }}</span>
  </div>
}
